name: ELUSoC 2026 CI Build & Test Matrix

on:
  push:
    branches: [ master, "feature/**", "fix/**" ]
  pull_request:
    branches: [ master ]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
      - run: npm install
        working-directory: ./backend
      - run: npm test
        working-directory: ./backend

  test-python-ai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - run: pip install -r requirements.txt
        working-directory: ./python-ai-service
      - run: pytest
        working-directory: ./python-ai-service
